# 도슨트 음성 생성 — data/docent_*.json 의 대본을 edge-tts로 mp3 생성 후 커밋
# - 문장 단위 합성 + 문장 사이 쉼(ffmpeg로 이어 붙임), 목소리 설정은 scripts/generate_audio.py 상단 상수
# - 배포 브랜치에 도슨트 JSON/스크립트가 바뀌면 자동 실행(없는 파일만 생성)
# - Actions 탭 → "도슨트 음성 생성" → Run workflow 로 수동 실행 가능
#     force   : 기존 파일도 전부 다시 생성
#     samples : 목소리 비교 샘플 4개만 audio/_samples/ 에 생성(전체 생성 안 함)
name: 도슨트 음성 생성

on:
  workflow_dispatch:
    inputs:
      force:
        description: '기존 음성 파일도 다시 생성(--force)'
        type: boolean
        default: false
      samples:
        description: '목소리 비교 샘플만 생성(audio/_samples/)'
        type: boolean
        default: false
  push:
    branches: [claude/travel-dashboard-mvp-thsi52]
    paths:
      - 'data/docent_*.json'
      - 'scripts/generate_audio.py'

permissions:
  contents: write
  pages: write

concurrency:
  group: docent-audio-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: edge-tts · ffmpeg 설치
        run: |
          pip install edge-tts
          command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
          ffmpeg -version | head -1

      - name: 목소리 비교 샘플 생성
        if: ${{ inputs.samples }}
        run: python scripts/generate_audio.py --samples

      - name: 음성 생성
        if: ${{ !inputs.samples }}
        run: python scripts/generate_audio.py 'data/docent_*.json' ${{ inputs.force && '--force' || '' }}

      - name: 음성 파일 커밋
        id: commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audio
          if git diff --cached --quiet; then
            echo "변경 없음"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${{ inputs.samples }}" = "true" ]; then
            MSG="chore(audio): 도슨트 목소리 비교 샘플 4종 생성"
          elif [ "${{ inputs.force }}" = "true" ]; then
            MSG="chore(audio): 도슨트 음성 전체 다시 생성 (문장 단위 합성)"
          else
            MSG="chore(audio): 도슨트 음성 생성"
          fi
          git commit -m "$MSG"
          for i in 1 2 3; do
            git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME" && break
            sleep 5
          done
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: GitHub Pages 재배포 요청
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "Pages 재배포 요청 실패(푸시로 자동 배포될 수 있음)"
